# Dependabot 依赖更新配置
# 定期检查 npm 与 GitHub Actions 依赖更新,自动开 PR;
# 开出的 PR 由 dependabot-automerge.yml workflow 启用 auto-merge,
# 在 CI(Unit Tests + E2E Tests)全部通过后由 GitHub 自动 squash 合并。
version: 2

updates:
  # npm 依赖(bun 共用 npm ecosystem)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    # minor + patch 合并到同一个 PR,减少 PR 数量;
    # major 各自独立 PR(便于单独回退)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions 自身(actions/checkout、setup-node、setup-bun 等)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
