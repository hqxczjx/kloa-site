name: Manual Deploy

# 可选的手动部署路径：仅 workflow_dispatch 触发，需要透明可控的构建/部署过程时
# 手动运行（逐 step 日志可查）。日常部署仍走 Cloudflare Workers Builds（git 集成
# 自动构建，含 PR preview），本 workflow 故意不设 push 触发器，避免同一次提交双部署。
#
# 所需 secrets（repo Settings → Secrets and variables → Actions 配置，当前未配置，
# 未配置时首个 step 会快速失败并给出提示）：
#   CLOUDFLARE_API_TOKEN —— CF dashboard → My Profile → API Tokens 创建 token，
#       权限至少 Workers Scripts:Edit + Account Settings:Read
#       （或直接使用 'Edit Cloudflare Workers' 模板）
#   CLOUDFLARE_ACCOUNT_ID —— CF dashboard 首页的 Account ID（非敏感值，走 secret
#       只为方便 wrangler-action 统一注入）
#
# 若将来要全自动替换 Workers Builds：先在 CF dashboard 断开本仓库的 git 集成，
# 再给本 workflow 加 push(main) 触发器——顺序不能反，否则一次 push 会双部署。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DEPLOY 以确认部署（防误触）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # 不取消进行中的部署：等上一次手动部署完成后再跑，避免中途取消导致版本交错
  group: deploy-manual
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify secrets & confirm input
        # secrets 未配置时最快速失败（先于任何 install/build），给出可操作信息。
        # secrets/inputs 走 env 间接引用而非 ${{ }} 插值进脚本：插值会把值拼进
        # shell 源码，是注入向量（confirm 可被用来外泄 token）
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          fail=0
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::缺少 secret CLOUDFLARE_API_TOKEN。请在 repo Settings → Secrets and variables → Actions 新建：CF dashboard → My Profile → API Tokens 创建（权限至少 Workers Scripts:Edit + Account Settings:Read，或直接使用 'Edit Cloudflare Workers' 模板）。"
            fail=1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::缺少 secret CLOUDFLARE_ACCOUNT_ID。值为 CF dashboard 首页的 Account ID。"
            fail=1
          fi
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::confirm 输入必须为 DEPLOY，实际收到 '$CONFIRM'。"
            fail=1
          fi
          exit $fail

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build
        # 独立构建步骤：日志单独可查，依赖/类型问题在触碰 CF API 前暴露。
        # 注：wrangler.jsonc 的 build.command 会让下面的 deploy 阶段再构建一次
        # （wrangler ≥4.20 自动执行 config 内构建命令），手动路径可接受；
        # 若介意双构建，可删除本步骤，仅依赖 deploy 内置构建。
        run: bun run build

      - name: Deploy
        # 不指定 wrangler-version：action 复用项目已安装的 wrangler（^4.120.1，
        # 与 Workers Builds 所用版本一致）
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
