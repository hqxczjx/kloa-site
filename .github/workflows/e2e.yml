name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'src/data/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'src/data/**'
      - '.vscode/**'
      - 'LICENSE'
  workflow_dispatch: # paths-ignore 跳过时，可在此手动触发

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Astro image assets
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: ${{ runner.os }}-astro-assets-${{ hashFiles('src/images/**', 'bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      # 缓存命中时不再跑 install-deps：ubuntu runner 已预装浏览器运行所需的全部系统库
      # （libnss3/libatk/libgbm/libpango 等），install-deps 此时实际只装字体；
      # e2e 不校验字体外观（且已 abort 字体 CDN），省 ~15s apt 安装

      - name: Run E2E tests
        run: bun run test:e2e:raw
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
