name: Bundle Size

# PR 体积监控：对比 PR 与 main 的 dist 产物体积（JS/CSS/字体/图片分类），
# 结果评论到 PR。总体积增长 >100KB 时该 job 失败（作为硬告警，不阻塞合并
# ——是否 required 由分支保护决定，当前未设为必需检查）。
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write # 评论体积报告

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build & measure PR
        run: |
          bun run build
          node scripts/bundle-size.mjs --json > pr.json

      - name: Build & measure main baseline
        run: |
          git fetch --depth=1 origin main
          git worktree add ../main origin/main
          # 复用已装依赖：main 与 PR 的 node_modules 差异由 bun 增量补齐
          cp -r node_modules ../main/node_modules
          cd ../main
          bun install
          bun run build
          node scripts/bundle-size.mjs --json > "$OLDPWD/main.json"

      - name: Report
        # compare 输出 markdown；>100KB 增长时 exit 1，用 || true 保住评论步骤
        run: |
          node scripts/bundle-size.mjs compare main.json pr.json > comment.md || echo -e "\n> ⚠️ 总体积增长超过 100KB" >> comment.md
          cat comment.md

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bundle-size
          path: comment.md
