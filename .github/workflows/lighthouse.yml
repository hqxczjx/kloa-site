name: Lighthouse CI

# 性能 / 可访问性 / SEO 自检，两条线：
#   - local（手动触发）：对本地 build 产物跑，改完性能/样式后按需验证；
#   - prod（每周定时 + 手动）：对生产站点 kloa.fans 跑，盯真实 CDN/边缘网络表现，
#     分数退化能及时发现。预算全设为 warn（仅报告，不阻塞任何流程）。
on:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 04:23（避开整点高峰；北京时间 12:23）
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  local:
    # 本地 dist 模式仅手动触发（schedule 只关心生产）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Run Lighthouse CI (local dist)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorageOutput: true

  prod:
    # 生产站点：每周定时盯真实网络表现；手动触发时也一并跑
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Lighthouse CI (kloa.fans)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.prod.json
          uploadArtifacts: true
          temporaryPublicStorageOutput: true

      - name: Summary
        if: always()
        run: |
          echo "## 🚦 Lighthouse（生产）" >> $GITHUB_STEP_SUMMARY
          echo '- 目标：https://kloa.fans/ ×3 次取均值' >> $GITHUB_STEP_SUMMARY
          echo "分数与趋势报告见 run 日志中的 temporary public storage 链接" >> $GITHUB_STEP_SUMMARY
