name: Unit Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'src/data/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'src/data/**'
      - '.vscode/**'
      - 'LICENSE'
  workflow_dispatch: # paths-ignore 跳过时，可在此手动触发

permissions:
  contents: read
  pull-requests: write # 覆盖率 PR 评论（vitest-coverage-report-action）

concurrency:
  # 加 github.workflow 前缀，避免 Unit Tests 与 E2E Tests 互相取消；
  # 同一 workflow 连续 push 仍会取消旧的（省资源）
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        # 不用 --frozen-lockfile:Dependabot 更新 package.json 时不会同步 bun.lock,
        # frozen 模式下其 PR 会在 install 步骤直接失败
        run: bun install

      - name: Run security lint
        # oxlint + eslint-plugin-security / no-unsanitized（jsPlugins 兼容层加载），
        # 本地 lint:security 的 CI 门禁版；CodeQL（每周 + PR）做更深的污点分析兜底
        run: bun run lint:security

      - name: Check font subset coverage
        # serif 标题字体是手动子集（源 OTF 不入库）；源码新增中文字符而未
        # 重新生成子集时，这里会失败并提示跑 bun run gen:fonts（详见脚本头部注释）
        run: node scripts/check-font-coverage.mjs

      - name: Run Astro check
        run: bun run astro-check

      - name: Run type check
        run: bun run type-check

      - name: Run unit tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run test:coverage
          else
            bun run test:run
          fi

      - name: Build
        # 兜底：确保静态产物可正常生成（astro check + astro build），
        # 防止类型/编译问题漏过 check 却在部署构建时才暴露
        run: bun run build

      - name: Coverage report
        # PR 评论 + step summary 展示覆盖率（读 coverage/ 下的 json-summary）
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Upload coverage artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
