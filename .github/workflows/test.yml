name: Unit Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'src/data/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'src/data/**'
      - '.vscode/**'
      - 'LICENSE'
  workflow_dispatch: # paths-ignore 跳过时，可在此手动触发

concurrency:
  # 加 github.workflow 前缀，避免 Unit Tests 与 E2E Tests 互相取消；
  # 同一 workflow 连续 push 仍会取消旧的（省资源）
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        # 不用 --frozen-lockfile:Dependabot 更新 package.json 时不会同步 bun.lock,
        # frozen 模式下其 PR 会在 install 步骤直接失败
        run: bun install

      - name: Run Astro check
        run: bun run astro-check

      - name: Run type check
        run: bun run type-check

      - name: Run unit tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run test:coverage
          else
            bun run test:run
          fi

      - name: Build
        # 兜底：确保静态产物可正常生成（astro check + astro build），
        # 防止类型/编译问题漏过 check 却在部署构建时才暴露
        run: bun run build

      - name: Upload coverage artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
